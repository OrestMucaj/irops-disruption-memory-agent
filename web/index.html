<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IROPS Disruption Memory — Operations Console</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="topbar">
  <div class="mark">
    <span class="name">IROPS DISRUPTION MEMORY</span>
    <span class="role">Operations Console</span>
  </div>
  <div class="spacer"></div>
  <div class="clock" id="clock">--:--:--<span>Z</span></div>
  <div class="sysstat" id="sysstat"><span class="dot"></span>connecting</div>
</div>

<nav class="tabs">
  <button data-view="cases" class="on">Disruptions <b id="tab-cases"></b></button>
  <button data-view="memory">Memory <b id="tab-memory"></b></button>
</nav>

<main>
  <section id="view-cases"></section>
  <section id="view-detail" hidden></section>
  <section id="view-memory" hidden></section>
</main>

<div id="toast" class="toast" hidden></div>

<!-- Written by scripts/deploy.ps1 with the Lambda Function URL. Absent locally,
     where the dev server synthesises an empty one and app.js falls back to
     same-origin /api. -->
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
